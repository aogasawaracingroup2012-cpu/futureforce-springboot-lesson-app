<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>問い合わせ詳細 | 問い合わせ管理システム</title>
	<link rel="stylesheet" th:href="@{/css/style.css}">
	<link rel="stylesheet"
		href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0">
</head>

<body>
	<div class="container">
		<header class="header">
			<div class="header-content">
				<div>
					<h1>問い合わせ詳細</h1>
				</div>
			</div>
		</header>

		<main>
			<div id="contact-detail" class="card">
				<div class="card-header">
					<div class="card-header-content">
						<div>
							<h2 id="contact-subject" th:text="${contact.subject}"></h2>
						</div>
						<div class="contact-id-container">
							<div class="text-muted">問い合わせID</div>
							<div id="contact-id" class="contact-id" th:text="${contact.id}"></div>
						</div>
					</div>
				</div>

				<div class="card-content">
					<div class="contact-info-grid">
						<div class="contact-info-item">
							<h3 class="text-muted">お名前</h3>
							<p id="contact-name" th:text="${contact.name}"></p>
						</div>
						<div class="contact-info-item">
							<h3 class="text-muted">メールアドレス</h3>
							<p id="contact-email" th:text="${contact.email}"></p>
						</div>
						<div class="contact-info-item">
							<h3 class="text-muted">電話番号</h3>
							<p id="contact-phone" th:text="${contact.phone}"></p>
						</div>
						<div class="contact-info-item">
							<h3 class="text-muted">作成日</h3>
							<p id="contact-created"
								th:text="${#temporals.format(contact.createdAt, 'yyyy/MM/dd HH:mm')}"></p>
						</div>
					</div>

					<div class="message-container">
						<h3 class="text-muted">メッセージ</h3>
						<div id="contact-message" class="message-box" th:text="${contact.message}"></div>
					</div>

					<div class="detail-actions">
						<div id="contact-updated" class="text-muted"
							th:text="'最終更新:' + ${#temporals.format(contact.createdAt, 'yyyy/MM/dd HH:mm')}"></div>
					</div>
				</div>
				<div class="card-footer">
					<a th:href="@{/contact}" class="btn btn-outline no-underline">
						<span class="material-symbols-outlined">arrow_back</span>
						<span>戻る</span>
					</a>
					<a th:href="@{|/contact/edit/${contact.id}|}" id="edit-contact-btn"
						class="btn btn-primary no-underline">
						<span class="material-symbols-outlined">edit</span>
						<span>編集</span>
					</a>
					<button type="button" id="delete-contact-btn" class="btn btn-primary no-underline delete-btn">
						<input type="hidden" class="contact-id" th:value="${contact.id}">
						<span class="material-symbols-outlined">delete</span>
						<span>削除</span>
					</button>
				</div>
			</div>
		</main>
	</div>
	<!-- 削除確認モーダル -->
	<div id="delete-modal" class="modal">
		<div class="modal-content">
			<div class="modal-header">
				<h2>この問い合わせを削除しますか？</h2>
				<p class="text-muted">この操作は元に戻せません。削除すると、この問い合わせのデータは完全に消去されます。</p>
			</div>
			<div class="modal-footer">
				<button type="button" id="cancel-btn" class="btn btn-outline">キャンセル</button>
				<form id="delete-form" method="post">
					<button type="submit" id="confirm-delete" class="btn btn-danger">OK</button>
				</form>
			</div>
		</div>
	</div>
	<div id="modal-overlay" class="modal-overlay"></div>
	</div>
	<script>
		document.addEventListener('DOMContentLoaded', function () {
			const deleteModal = document.getElementById('delete-modal');
			const overlay = document.getElementById('modal-overlay');
			const form = document.getElementById('delete-form');
			const deleteButtons = document.querySelectorAll('.delete-btn');
			const cancelBtn = document.getElementById('cancel-btn');

			deleteButtons.forEach(btn => {
				btn.addEventListener('click', function () {
					const id = this.querySelector('.contact-id').value;

					deleteModal.style.display = 'flex';
					overlay.style.display = 'block';
					form.action = `/contact/delete/${id}`;
				});
			});
			cancelBtn.addEventListener('click', function () {
				deleteModal.style.display = 'none';
				overlay.style.display = 'none';
			});
		});
	</script>
	<script th:src="@{/js/common.js}"></script>
</body>

</html>
