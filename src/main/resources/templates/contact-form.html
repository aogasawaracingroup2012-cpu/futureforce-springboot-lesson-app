
<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title th:text="${contact.id} != null ? '問い合わせ編集' : '新規問い合わせ'"></title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0">
</head>

<body>
  <div class="container">
    <header class="header">
      <div class="header-content">
        <div>
          <h1 id="form-title" th:text="${contact.id} != null ? '問い合わせ編集' : '新規問い合わせ'"></h1>
        </div>
      </div>
    </header>

    <main>
      <div class="card">
        <div class="card-content">
          <form id="contact-form"  th:action="${contact.id} != null ? @{|/contact/update/${contact.id}|} : @{/contact/create}" th:object="${contact}" method="post" novalidate>
            <div class="form-grid">
              <div class="form-group">
                <label for="name">お名前 <span class="required">*</span></label>
                <input type="text"  th:field="*{name}" id="name" name="name" placeholder="山田 太郎" required>
                <div class="error-message" id="name-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}">
                </div>
              </div>

              <div class="form-group">
                <label for="email">メールアドレス <span class="required">*</span></label>
                <input type="email"  th:field="*{email}" id="email" name="email" placeholder="example@example.com" required>
                <div class="error-message" id="email-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}">
                </div>
              </div>

              <div class="form-group">
                <label for="phone">電話番号（任意）</label>
                <input type="tel"  th:field="*{phone}" id="phone" name="phone" placeholder="090-1234-5678">
              </div>
            </div>

            <div class="form-group">
              <label for="subject">件名 <span class="required">*</span></label>
              <input type="text"  th:field="*{subject}" id="subject" name="subject" placeholder="お問い合わせ内容の件名" required>
              <div class="error-message" id="subject-error" th:if="${#fields.hasErrors('subject')}" th:errors="*{subject}"></div>
            </div>

            <div class="form-group">
              <label for="message">メッセージ <span class="required">*</span></label>
              <textarea  th:field="*{message}" id="message" name="message" placeholder="お問い合わせ内容を詳しく入力してください" rows="6"></textarea>
              <div class="error-message" id="message-error" th:if="${#fields.hasErrors('message')}" th:errors="*{message}"></div>
            </div>
          </form>
        </div>

        <div class="card-footer">
          <a th:href="${contact.id} != null ? @{|/contact/detail/${contact.id}|}  : @{/contact}" id="cancel-btn" class="btn btn-outline">キャンセル</a>
          <button type="submit" form="contact-form" id="submit-btn" class="btn btn-primary" th:text="${contact.id} != null ? '更新' : '作成'"></button>
        </div>
      </div>
    </main>
  </div>
  <script th:src="@{/js/common.js}"></script>
</body>

</html>
