<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>問い合わせ管理システム</title>
	<link rel="stylesheet" th:href="@{/css/style.css}">
	<link rel="stylesheet"
		href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0">
</head>

<body>
	<div class="container">
		<header class="header">
			<div class="header-content">
				<div>
					<h1>問い合わせ管理</h1>
					<p class="text-muted">お客様からの問い合わせを管理します</p>
				</div>
				<a class="btn btn-primary no-underline" th:href="@{/contact/new}">新規作成</a>
			</div>
		</header>

		<main>
			<div th:if="${contacts.isEmpty()}" id="empty-state" class="empty-state">
				<h3>問い合わせがありません</h3>
				<p class="text-muted">新しい問い合わせを作成してください</p>
				<a class="btn btn-primary no-underline" th:href="@{/contact/new}">新規作成</a>
			</div>

			<!-- 問い合わせがある場合 -->
			<div th:unless="${contacts.isEmpty()}" id="contacts-table-container" class="table-container">
				<table id="contacts-table" class="table">
					<thead>
						<tr>
							<th>ID</th>
							<th>名前</th>
							<th>メール</th>
							<th>件名</th>
							<th>作成日</th>
							<th class="text-right">アクション</th>
						</tr>
					</thead>
					<tbody id="contacts-body">
						<tr th:each="contact : ${contacts}">
							<td th:text="${contact.id}">1</td>
							<td th:text="${contact.name}">名前</td>
							<td th:text="${contact.email}">example@mail.com</td>
							<td th:text="${contact.subject}">件名</td>
							<td th:text="${#temporals.format(contact.createdAt, 'yyyy/MM/dd HH:mm')}">2024-01-01</td>
							<td class="text-right">
								<div class="action-buttons">
									<a class="action-button view" title="詳細"
										th:href="@{|/contact/detail/${contact.id}|}">
										<span class="material-symbols-outlined">visibility</span>
									</a>
									<a class="action-button edit" title="編集" th:href="@{|/contact/edit/${contact.id}|}">
										<span class="material-symbols-outlined">edit</span>
									</a>
									<button type="button" class="action-button delete delete-btn" title="削除">
										<input type="hidden" class="contact-id" th:value="${contact.id}">
										<span class="material-symbols-outlined">delete</span>
									</button>
								</div>
							</td>
						</tr>
					</tbody>
				</table>
			</div>
		</main>

		<!-- 削除確認モーダル -->
		<div id="delete-modal" class="modal">
			<div class="modal-content">
				<div class="modal-header">
					<h2>この問い合わせを削除しますか？</h2>
					<p class="text-muted">この操作は元に戻せません。削除すると、この問い合わせのデータは完全に消去されます。</p>
				</div>
				<div class="modal-footer">
					<button type="button" id="cancel-btn" class="btn btn-outline">キャンセル</button>
					<form id="delete-form" method="post">
						<button type="submit" id="confirm-delete" class="btn btn-danger">OK</button>
					</form>
				</div>
			</div>
		</div>
		<div id="modal-overlay" class="modal-overlay"></div>
	</div>
	<script>
		document.addEventListener('DOMContentLoaded', function () {
			const deleteModal = document.getElementById('delete-modal');
			const overlay = document.getElementById('modal-overlay');
			const form = document.getElementById('delete-form');
			const deleteButtons = document.querySelectorAll('.delete-btn');
			const cancelBtn = document.getElementById('cancel-btn');

			deleteButtons.forEach(btn => {
				btn.addEventListener('click', function () {
					const id = this.querySelector('.contact-id').value;

					deleteModal.style.display = 'flex';
					overlay.style.display = 'block';
					form.action = `/contact/delete/${id}`;
				});
			});
			cancelBtn.addEventListener('click', function(){
				deleteModal.style.display = 'none';
				overlay.style.display = 'none';
			});
		});
	</script>
	<script th:src="@{/js/common.js}"></script>
</body>

</html>
