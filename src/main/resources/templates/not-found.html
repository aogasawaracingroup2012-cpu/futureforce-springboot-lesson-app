<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ページが見つかりません | 問い合わせ管理システム</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0">
</head>

<body>
  <div class="container">
    <header class="header">
      <div class="header-content">
        <div>
          <h1>問い合わせ管理システム</h1>
        </div>
      </div>
    </header>

    <main>
      <div class="card">
        <div class="card-content" style="text-align: center; padding: 3rem 2rem;">
          <div style="margin-bottom: 2rem;">
            <span class="material-symbols-outlined" style="font-size: 4rem; color: var(--text-muted);">
              error
            </span>
          </div>
          <h2 style="margin-bottom: 1rem; color: var(--text-primary);">ページが見つかりません</h2>
          <p style="margin-bottom: 2rem; color: var(--text-muted); font-size: 1.1rem;">
            お探しのページは存在しないか、削除された可能性があります。
          </p>
          <div>
            <a class="btn btn-primary" href="/contact">
              <span class="material-symbols-outlined" style="margin-right: 0.5rem;">
                home
              </span>
              トップページに戻る
            </a>
          </div>
        </div>
      </div>
    </main>
  </div>
  <script th:src="@{/js/common.js}"></script>
</body>

</html>
