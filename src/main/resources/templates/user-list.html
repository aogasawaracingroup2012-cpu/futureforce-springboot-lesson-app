<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>ユーザー一覧</title>
</head>

<body>
    <h1>ユーザー一覧</h1>
    <ul>
        <!-- li要素をth:each属性で動的に変更する -->
        <li th:each="user : ${users}" th:text="${user}">ユーザー1</li>
    </ul>
    <script th:src="@{/js/common.js}"></script>
</body>

</html>
